question: "大模型记忆技术的发展全貌、主要机制路线、时间跨度、可验证效果、失败边界与关键工作是什么？"
objects: "以大语言模型为核心的模型、对话系统、检索增强系统和自主智能体；同时纳入直接评测这些对象记忆能力的数据集与基准。"
tasks: "知识或经历的写入、保持、检索、更新、压缩、巩固、个性化、编辑、遗忘与删除；以及上述能力的评测、安全和治理。"
contexts: "单轮提示、长对话、长程任务、跨会话用户交互、开放世界知识更新、持续部署与模型生命周期管理。"
mechanism_scope: "模型权重与知识编辑；上下文、KV/隐状态、循环和压缩记忆；外部检索与非参数存储；智能体情景/语义/程序记忆；用户长期记忆；评测、隐私、安全、污染和可控遗忘。"
outcomes: "记忆准确性与时效性、长程任务完成、检索和利用质量、持续学习稳定性、个性化效用、隐私与删除有效性、鲁棒性、成本和真实部署证据。"
time_window: "奠基工作至 2026-08-11"
source_families: ["正式会议与期刊", "官方报告与标准", "作者项目与代码"]
publication_statuses: ["同行评议", "预印本", "官方报告"]
must_cover_axes: ["主要路线", "第二分类轴", "时间线", "评测", "反证与安全"]
exclusions:
  - "仅把 memory 当作修辞、但没有状态保存或利用机制与评测的工作"
  - "普通检索增强应用、向量数据库产品或缓存工程，若没有 LLM 记忆机制、管理或评测贡献"
  - "仅扩大上下文窗口或提高注意力效率、但没有长程状态保持或记忆证据的工作"
  - "通用微调、测试时适应、零样本、免回放或持续学习工作，若与 LLM 记忆的写入、保持、更新或遗忘没有直接对应"
  - "训练数据记忆化研究若只测版权/抽取而不贡献记忆机制或治理边界；关键安全反证可作为评测治理路线纳入"
  - "无法定位一手入口、只有二手转述、营销声明或元数据冲突无法解决的候选"
cutoff_date: "2026-08-11"
target_level: "L2"
current_level: "L2"
current_level_note: "研究覆盖、深读、主张审计、严格离线门禁以及最终位置的桌面、手机、键盘和 file:// 真实浏览器回归均已通过。"
audience: "研究人员与具备大模型基础背景的专业读者"
languages: ["英文一手文献", "中文检索辅助；题名保留原文"]
primary_outcomes: ["论文", "正式会议或期刊版本", "高相关预印本", "官方技术报告", "基准与数据集", "作者项目与代码"]
candidate_primary_routes:
  - "参数记忆与知识修改"
  - "上下文与隐状态记忆"
  - "外部检索与非参数记忆"
  - "智能体记忆管理"
  - "个性化与用户长期记忆"
  - "评测、安全与治理"
candidate_second_axis:
  label: "记忆持续时间"
  levels: ["即时或单轮", "会话内", "跨会话长期", "模型生命周期"]
comprehensiveness_definition: "执行七类基础查询家族及多轮异源扩展；六条候选路线均覆盖代表、前沿和评价或记录缺口；在最后一次高边际扩展后取得两个来源或查询家族不同的低边际完整轮，完成核心深读和主张审计；不宣称绝对穷尽。"
scope_version: "1.0"
scope_changes:
  - date: "2026-08-10"
    reason: "初始化默认范围并区分核心概念与邻近概念"
    impact: "将参数、上下文、外部、智能体、个性化和治理纳入同一操作定义；排除纯词面重合与无机制贡献的应用。"
  - date: "2026-08-11"
    reason: "任务执行跨过当地日期边界"
    impact: "将截止日顺延一天；范围、纳排标准和分类轴均不改变。"
